name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - run: bundle exec rubocop

  spec:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0.6"]
        server: ["redis:7-alpine"]
        include:
          # XAUTOCLAIM reply shape differs between 6.2 and 7.
          - ruby: "4.0.6"
            server: "redis:6.2-alpine"
          - ruby: "4.0.6"
            server: "valkey/valkey:8-alpine"
    services:
      redis:
        image: ${{ matrix.server }}
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      HOPPER_TEST_REDIS_URL: redis://127.0.0.1:6399/0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
