name: Release

# Manual: pick the version to release by bumping lib/rspec/hopper/version.rb and
# the changelog first, then run this workflow from main. `rake release` creates
# and pushes the v<version> tag itself, so there is no tag trigger here; it also
# refuses to run against a dirty tree or a tag that already exists.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      HOPPER_TEST_REDIS_URL: redis://127.0.0.1:6399/0
    steps:
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release from main, not ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - run: bundle exec rake

  push:
    name: Push gem to RubyGems.org
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing
      contents: write # `rake release` pushes the release tag
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
